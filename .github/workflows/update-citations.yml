name: Update Google Scholar Citations

on:
  schedule:
    # Try every day. Google Scholar sometimes blocks a runner's IP, and each day gets a fresh runner.
    # Once an update succeeds, the check-due job skips further fetches until 7 days have passed.
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # lets the job start the deploy workflow

concurrency:
  group: update-citations
  cancel-in-progress: false

jobs:
  check-due:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check whether an update is due
        id: due
        run: |
          last=$(grep -m1 last_updated _data/citations.yml 2>/dev/null | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
          if [ -z "$last" ]; then
            echo "No last_updated date found, update is due."
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          age=$(( ($(date -u +%s) - $(date -u -d "$last" +%s)) / 86400 ))
          if [ "$age" -ge 7 ]; then
            echo "Last update was $age days ago, update is due."
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "Last update was $age days ago, nothing to do."
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

  update-citations:
    needs: check-due
    if: needs.check-due.outputs.due == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # See docs/CUSTOMIZE.md for details on how to set up PAT for triggering subsequent workflows
      #        with:
      #          token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          echo "🔧 Installing dependencies..."
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Save current citations.yml hash
        id: before
        run: |
          echo "📦 Checking existing citations.yml hash..."
          if [ -f _data/citations.yml ]; then
            sha_before=$(sha256sum _data/citations.yml | awk '{print $1}')
            echo "sha_before=$sha_before" >> $GITHUB_OUTPUT
            echo "📝 SHA before: $sha_before"
          else
            echo "sha_before=none" >> $GITHUB_OUTPUT
            echo "📝 No existing citations.yml file found."
          fi

      - name: Run citation update script
        id: run_citation_update
        shell: bash
        run: |
          set +e
          echo "🚀 Running citation update script (single attempt)..."
          start_time=$(date)
          timeout 120 python -u bin/update_scholar_citations.py
          status=$?
          end_time=$(date)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ $status -eq 0 ]; then
            echo "✅ Citation update succeeded (started at $start_time, ended at $end_time)."
            echo "✅ Citation update succeeded." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Citation update script failed with exit code $status (started at $start_time, ended at $end_time)."
            echo "❌ Citation update script failed with exit code $status." >> $GITHUB_STEP_SUMMARY
          fi
          set -e

      - name: Fail only when the citation data is stale
        if: steps.run_citation_update.outputs.status != '0'
        run: |
          age_days=$(python -c "import yaml, datetime as d; m = yaml.safe_load(open('_data/citations.yml'))['metadata']['last_updated']; print((d.date.today() - d.date.fromisoformat(str(m))).days)" 2>/dev/null || echo 999)
          if [ "$age_days" -gt 14 ]; then
            echo "::error::Citation data is $age_days days old and updates keep failing. Google Scholar is probably blocking the runners."
            exit 1
          fi
          echo "::warning::Citation update failed, but the data is only $age_days days old. The next daily run will try again."

      - name: Save new citations.yml hash
        id: after
        run: |
          echo "🔍 Checking updated citations.yml hash..."
          if [ -f _data/citations.yml ]; then
            sha_after=$(sha256sum _data/citations.yml | awk '{print $1}')
            echo "sha_after=$sha_after" >> $GITHUB_OUTPUT
            echo "📝 SHA after: $sha_after"
          else
            echo "sha_after=none" >> $GITHUB_OUTPUT
            echo "📝 citations.yml was not created or is missing."
          fi

      - name: Report citations.yml change in summary
        run: |
          echo "📋 Comparing citation file hashes..."
          if [ "${{ steps.before.outputs.sha_before }}" != "${{ steps.after.outputs.sha_after }}" ]; then
            echo "✅ _data/citations.yml was updated."
            echo "✅ _data/citations.yml was updated." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ _data/citations.yml was not changed."
            echo "ℹ️ _data/citations.yml was not changed." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          echo "🔧 Git configured."

      - name: Commit and push if changed
        id: commit
        run: |
          git add _data/citations.yml
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "📤 Committing and pushing changes..."
            git commit -m "chore: update Google Scholar citations"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the default token does not start other workflows, but workflow_dispatch is exempt.
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
